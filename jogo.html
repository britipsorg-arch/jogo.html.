
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB TRUCK SIMULATOR - Bernardino de Campos</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    overflow: hidden;
    background: #101820;
    font-family: Arial, sans-serif;
    color: white;
}

#topo {
    position: absolute;
    top: 12px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 5;
    text-shadow: 2px 2px 4px black;
    pointer-events: none;
}

#topo h2 {
    color: #00b7ff;
    margin: 0;
}

#info {
    position: absolute;
    left: 12px;
    bottom: 12px;
    z-index: 5;
    background: #101c30dd;
    padding: 12px;
    border-radius: 10px;
}

#controles {
    position: absolute;
    bottom: 15px;
    right: 12px;
    z-index: 6;
    display: flex;
    gap: 8px;
}

button {
    padding: 15px;
    background: #087dcc;
    border: 0;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    font-size: 16px;
}

#camera {
    position: absolute;
    top: 75px;
    right: 12px;
    z-index: 6;
}
</style>
</head>

<body>

<div id="topo">
<h2>🚛 AB TRUCK SIMULATOR</h2>
<p>BERNARDINO DE CAMPOS - SP</p>
</div>

<div id="info">
    <b>AB GAMES</b><br>
    Cidade 3D - Versão 1.0
</div>

<button id="camera" onclick="trocarCamera()">📷 CÂMERA</button>

<div id="controles">
    <button onpointerdown="direcao(-1)" onpointerup="parar()" onpointerleave="parar()">⬅️</button>
    <button onpointerdown="direcao(1)" onpointerup="parar()" onpointerleave="parar()">➡️</button>
    <button onpointerdown="acelerar()" onpointerup="parar()" onpointerleave="parar()">ACELERAR</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const cena = new THREE.Scene();
cena.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
    70, window.innerWidth / window.innerHeight, 0.1, 1000
);

const renderizador = new THREE.WebGLRenderer({antialias:true});
renderizador.setSize(window.innerWidth, window.innerHeight);
renderizador.shadowMap.enabled = true;
document.body.appendChild(renderizador.domElement);

cena.add(new THREE.HemisphereLight(0xffffff, 0x557755, 2));

const sol = new THREE.DirectionalLight(0xffffff, 2);
sol.position.set(30, 60, 20);
sol.castShadow = true;
cena.add(sol);

function bloco(x,y,z,l,a,p,cor) {
    const objeto = new THREE.Mesh(
        new THREE.BoxGeometry(l,a,p),
        new THREE.MeshStandardMaterial({color:cor})
    );
    objeto.position.set(x,y,z);
    objeto.castShadow = true;
    objeto.receiveShadow = true;
    cena.add(objeto);
    return objeto;
}

// TERRENO
bloco(0,-0.5,0,300,1,300,0x548b45);

// RUA PRINCIPAL
bloco(0,0.02,0,16,0.1,250,0x333333);

// CALÇADAS
bloco(-10,0.1,0,4,0.2,250,0xaaaaaa);
bloco(10,0.1,0,4,0.2,250,0xaaaaaa);

// FAIXA CENTRAL
for(let z=-120;z<125;z+=12) {
    bloco(0,0.09,z,0.25,0.03,6,0xffffff);
}

// CASAS DOS DOIS LADOS
const cores = [0xe8d3ad,0xd9e2e8,0xd9b6a0,0xe4e4c7];

for(let z=-100;z<110;z+=25) {
    for(let lado of [-1,1]) {
        const x=lado*19;
        const cor=cores[Math.floor(Math.random()*cores.length)];

        bloco(x,3,z,13,6,14,cor);
        bloco(x,6.5,z,14,1,15,0x884422);
        bloco(x,1.8,z-7.1,3,3.5,0x75c9e8);
        bloco(x-3,0.9,z-7.2,1.5,1.8,0x654321);
    }
}

// LOJAS
function loja(x,z,cor,nome) {
    bloco(x,3,z,16,6,13,cor);
    bloco(x,6.2,z-6.7,17,0.5,1,0x222222);
    bloco(x,1.7,z-6.8,5,3.2,0x91d7f0);
}

loja(-25,-35,0xe9bd72,"MERCADO");
loja(25,35,0xd7e5ef,"COMÉRCIO");

// POSTE
function poste(x,z) {
    bloco(x,4,z,0.3,8,0.3,0x444444);
    bloco(x,8,z,3,0.2,0.3,0x333333);
}

for(let z=-100;z<110;z+=30) {
    poste(-13,z);
    poste(13,z);
}

// ÁRVORES
function arvore(x,z) {
    bloco(x,2,z,1,4,1,0x70421e);

    const copa = new THREE.Mesh(
        new THREE.SphereGeometry(3,10,10),
        new THREE.MeshStandardMaterial({color:0x20752c})
    );

    copa.position.set(x,5,z);
    cena.add(copa);
}

for(let z=-100;z<110;z+=18) {
    arvore(-14,z);
    arvore(14,z+8);
}

// SCANIA VERMELHA PROVISÓRIA
const caminhao = new THREE.Group();
cena.add(caminhao);

const cabine = bloco(0,1.7,0,3.2,3.2,4,0xc90019);
cabine.position.set(0,1.7,0);
caminhao.add(cabine);

const vidro = bloco(0,2.5,-2.02,2.3,1.1,0.1,0x80c9e8);
caminhao.add(vidro);

const carroceria = bloco(0,1.2,3,3.4,2,2.5,0xaaaaaa);
caminhao.add(carroceria);

function roda(x,z) {
    const r = new THREE.Mesh(
        new THREE.CylinderGeometry(0.65,0.65,0.5,16),
        new THREE.MeshStandardMaterial({color:0x111111})
    );
    r.rotation.z=Math.PI/2;
    r.position.set(x,0.65,z);
    caminhao.add(r);
}

roda(-1.6,-1.2);
roda(1.6,-1.2);
roda(-1.6,3);
roda(1.6,3);

caminhao.position.set(0,0,-15);

// CONTROLES
let velocidade=0;
let direcaoAtual=0;
let cameraCabine=false;

function acelerar() { velocidade=0.35; }
function direcao(v) { direcaoAtual=v; }
function parar() { velocidade=0; direcaoAtual=0; }

function trocarCamera() {
    cameraCabine=!cameraCabine;
}

window.addEventListener("keydown",e=>{
    if(e.key==="ArrowUp" || e.key==="w") velocidade=0.35;
    if(e.key==="ArrowLeft" || e.key==="a") direcaoAtual=-1;
    if(e.key==="ArrowRight" || e.key==="d") direcaoAtual=1;
});

window.addEventListener("keyup",parar);

function animar() {
    requestAnimationFrame(animar);

    caminhao.position.z-=velocidade;
    caminhao.position.x+=direcaoAtual*0.12;

    caminhao.position.x=Math.max(-5,Math.min(5,caminhao.position.x));

    if(cameraCabine) {
        camera.position.set(
            caminhao.position.x,
            2.8,
            caminhao.position.z-1.5
        );
        camera.rotation.set(0,0,0);
    } else {
        camera.position.set(
            caminhao.position.x,
            7,
            caminhao.position.z+13
        );
        camera.lookAt(
            caminhao.position.x,
            1.5,
            caminhao.position.z-5
        );
    }

    renderizador.render(cena,camera);
}

animar();

window.addEventListener("resize",()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderizador.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
